<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <title>Conexión de los caudalímetros FS300A a la WeMos D1 R1</title>
    <desc>Cuatro caudalímetros FS300A conectados a una WeMos D1 R1. Cada sensor lleva su señal a un GPIO distinto (14, 12, 13 y 2) y todos comparten el riel de 3.3 voltios y el de tierra.</desc>

    <rect x="0" y="0" width="700" height="380" fill="#ffffff"/>

    <text x="40" y="26" font-size="15" font-weight="600" fill="#111827">Caudalímetros FS300A — WeMos D1 R1 (ESP8266)</text>

    <!-- riel GND -->
    <g stroke="#525252" stroke-width="2" fill="none">
        <path d="M 60 90 L 60 48 L 590 48 L 590 330"/>
        <path d="M 430 161 L 590 161"/>
        <path d="M 430 211 L 590 211"/>
        <path d="M 430 261 L 590 261"/>
        <path d="M 430 311 L 590 311"/>
    </g>

    <!-- riel 3V3 -->
    <g stroke="#dc2626" stroke-width="2" fill="none">
        <path d="M 90 90 L 90 66 L 520 66 L 520 330"/>
        <path d="M 430 139 L 520 139"/>
        <path d="M 430 189 L 520 189"/>
        <path d="M 430 239 L 520 239"/>
        <path d="M 430 289 L 520 289"/>
    </g>

    <!-- señales -->
    <g stroke="#d97706" stroke-width="2" fill="none">
        <path d="M 190 150 L 260 150"/>
        <path d="M 190 200 L 260 200"/>
        <path d="M 190 250 L 260 250"/>
        <path d="M 190 300 L 260 300"/>
    </g>

    <!-- uniones -->
    <g fill="#dc2626">
        <circle cx="520" cy="139" r="3.5"/><circle cx="520" cy="189" r="3.5"/>
        <circle cx="520" cy="239" r="3.5"/><circle cx="520" cy="289" r="3.5"/>
    </g>
    <g fill="#525252">
        <circle cx="590" cy="161" r="3.5"/><circle cx="590" cy="211" r="3.5"/>
        <circle cx="590" cy="261" r="3.5"/><circle cx="590" cy="311" r="3.5"/>
    </g>

    <!-- placa -->
    <rect x="40" y="90" width="150" height="250" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="115" y="115" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">WeMos D1 R1</text>
    <text x="115" y="132" font-size="11" fill="#4b5563" text-anchor="middle">ESP8266 · 3.3 V</text>
    <g font-size="12" fill="#111827" text-anchor="end">
        <text x="180" y="154">GPIO14</text>
        <text x="180" y="204">GPIO12</text>
        <text x="180" y="254">GPIO13</text>
        <text x="180" y="304">GPIO2</text>
    </g>
    <g font-size="10" fill="#6b7280" text-anchor="middle">
        <text x="60" y="84">GND</text>
        <text x="92" y="84">3V3</text>
    </g>

    <!-- sensores -->
    <g>
        <rect x="260" y="128" width="170" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
        <text x="345" y="147" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Tubo 1</text>
        <text x="345" y="163" font-size="11" fill="#4b5563" text-anchor="middle">FS300A</text>
    </g>
    <g>
        <rect x="260" y="178" width="170" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
        <text x="345" y="197" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Tubo 2</text>
        <text x="345" y="213" font-size="11" fill="#4b5563" text-anchor="middle">FS300A</text>
    </g>
    <g>
        <rect x="260" y="228" width="170" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
        <text x="345" y="247" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Tubo 3</text>
        <text x="345" y="263" font-size="11" fill="#4b5563" text-anchor="middle">FS300A</text>
    </g>
    <g>
        <rect x="260" y="278" width="170" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
        <text x="345" y="297" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Tubo 4</text>
        <text x="345" y="313" font-size="11" fill="#4b5563" text-anchor="middle">FS300A</text>
    </g>

    <!-- etiquetas de riel -->
    <text x="520" y="348" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="600">+3V3</text>
    <text x="590" y="348" font-size="11" fill="#525252" text-anchor="middle" font-weight="600">GND</text>

    <!-- leyenda -->
    <g font-size="10" fill="#4b5563">
        <line x1="40" y1="360" x2="64" y2="360" stroke="#d97706" stroke-width="2"/>
        <text x="70" y="364">señal (pulsos)</text>
        <line x1="160" y1="360" x2="184" y2="360" stroke="#dc2626" stroke-width="2"/>
        <text x="190" y="364">3.3 V</text>
        <line x1="240" y1="360" x2="264" y2="360" stroke="#525252" stroke-width="2"/>
        <text x="270" y="364">GND</text>
        <text x="330" y="364">· sin divisor de tensión: los sensores operan a 3.3 V</text>
    </g>
</svg>